name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      capacitor_server_url:
        description: URL publicada carregada pelo app mobile
        required: false
        default: https://pessoauto.vercel.app

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Configure Capacitor server URL
        run: |
          printf 'CAPACITOR_SERVER_URL=%s\n' "${{ github.event.inputs.capacitor_server_url || 'https://pessoauto.vercel.app' }}" > .env.capacitor

      - name: Sync Capacitor Android project
        run: npm run cap:sync:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pessoauto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
