<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PessoAuto</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      main {
        max-width: 28rem;
        padding: 2rem;
      }

      h1 {
        margin-bottom: 0.75rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        line-height: 1.5;
      }

      code {
        display: inline-block;
        margin-top: 0.75rem;
        padding: 0.25rem 0.5rem;
        border-radius: 0.375rem;
        background: #1e293b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PessoAuto</h1>
      <p>
        O app mobile precisa de uma URL configurada em
        <code>CAPACITOR_SERVER_URL</code> para carregar a versao publicada.
      </p>
    </main>
  </body>
</html>
